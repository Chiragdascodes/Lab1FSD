<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <!-- A right hand, back towards us, pointing: the index finger rises from
       the left edge of the fist, the other three are curled with their
       knuckles along the top, and the thumb stands out to the left.
       Drawn as a light map: grey level is how much light a surface catches,
       alpha is the silhouette. gate.js colours it thermally under the ice.
       The fingertip sits at (200, 24), the point that follows the pointer. -->
  <defs>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.4" stop-color="#b6b6b6"/>
      <stop offset="0.72" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <radialGradient id="fist" cx="0.38" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="0.5" stop-color="#9e9e9e"/>
      <stop offset="1" stop-color="#383838"/>
    </radialGradient>
    <radialGradient id="knuckle" cx="0.36" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.55" stop-color="#a0a0a0"/>
      <stop offset="1" stop-color="#3c3c3c"/>
    </radialGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#383838"/>
      <stop offset="0.5" stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="index" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="0.36" stop-color="#ececec"/>
      <stop offset="0.64" stop-color="#b2b2b2"/>
      <stop offset="1" stop-color="#363636"/>
    </linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- forearm, leaving the frame at the bottom -->
  <path d="M196 548 C194 640 186 724 176 800 L378 800 C372 724 362 640 352 548 Z" fill="url(#arm)"/>

  <!-- the thumb, standing out to the left of the fist -->
  <ellipse cx="148" cy="428" rx="30" ry="74" transform="rotate(-38 148 428)" fill="url(#thumb)"/>

  <!-- back of the fist -->
  <path d="M168 348 C160 420 166 500 190 572 L354 572 C374 500 380 420 364 364 C352 322 300 308 262 312 C220 306 176 310 168 348 Z" fill="url(#fist)"/>

  <!-- three curled fingers, knuckles along the top -->
  <ellipse cx="256" cy="320" rx="38" ry="32" fill="url(#knuckle)"/>
  <ellipse cx="302" cy="334" rx="34" ry="30" fill="url(#knuckle)"/>
  <ellipse cx="340" cy="360" rx="28" ry="28" fill="url(#knuckle)"/>

  <!-- the index finger, rising from the left edge of the fist -->
  <path d="M170 360 C166 272 168 150 172 66 C174 20 226 18 228 64 C234 150 238 272 232 360 Z" fill="url(#index)"/>
  <ellipse cx="200" cy="158" rx="24" ry="5" fill="#2a2a2a" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="202" cy="252" rx="27" ry="6" fill="#2a2a2a" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="192" cy="72" rx="14" ry="30" fill="url(#glint)" opacity="0.75"/>

  <!-- catch-lights -->
  <ellipse cx="236" cy="410" rx="46" ry="30" fill="#fff" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="250" cy="310" rx="16" ry="9" fill="#fff" opacity="0.5" filter="url(#soft)"/>
</svg>
